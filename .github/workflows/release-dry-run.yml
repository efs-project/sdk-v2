# SPDX-License-Identifier: MIT
# Release DRY RUN (docs/adr/0004). No publish step, no id-token, no secrets.
name: release-dry-run

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || (github.event.pull_request.number == 1 && github.head_ref == 'chore/s0-scaffold' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack:all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packs-first-build
          path: .packs/
          include-hidden-files: true
          if-no-files-found: error

  repeat-and-verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
      - run: pnpm install --frozen-lockfile
      - name: second clean build on a fresh runner
        run: pnpm build && pnpm pack:all
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packs-first-build
          path: ${{ runner.temp }}/packs-first-build
      - name: compare unpacked contents (repeatability, not independent reproduction)
        run: node tools/release-dry-run.mjs --compare "$RUNNER_TEMP/packs-first-build"
      - name: install the FIRST build's exact artifacts into fresh consumers
        run: |
          rm -rf .packs && cp -R "$RUNNER_TEMP/packs-first-build" .packs
          node tools/consumers.mjs --only node,ts,browser,foundry
      - name: draft release manifest (includes changeset status)
        run: node tools/release-dry-run.mjs --repeated-build match
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: .packs/
          include-hidden-files: true
          if-no-files-found: error
